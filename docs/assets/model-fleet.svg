<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="fleetTitle fleetDesc">
  <title id="fleetTitle">ModelMariner Fleet</title>
  <desc id="fleetDesc">Five model vessels sailing an animated sea, each labelled with its role in the routing fleet.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#123a63"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#155e75"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <rect width="800" height="340" fill="url(#sky)"/>
  <circle cx="680" cy="70" r="34" fill="url(#moon)"/>

  <!-- twinkling stars -->
  <g fill="#e2e8f0">
    <circle cx="90" cy="50" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="38" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="66" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="44" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="80" r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- sea -->
  <rect y="210" width="800" height="130" fill="url(#sea)"/>
  <!-- animated swell -->
  <g opacity="0.35" stroke="#67e8f9" stroke-width="2" fill="none">
    <path d="M0 226 Q 50 216 100 226 T 200 226 T 300 226 T 400 226 T 500 226 T 600 226 T 700 226 T 800 226">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
        values="M0 226 Q 50 216 100 226 T 200 226 T 300 226 T 400 226 T 500 226 T 600 226 T 700 226 T 800 226;
                M0 226 Q 50 236 100 226 T 200 226 T 300 226 T 400 226 T 500 226 T 600 226 T 700 226 T 800 226;
                M0 226 Q 50 216 100 226 T 200 226 T 300 226 T 400 226 T 500 226 T 600 226 T 700 226 T 800 226"/>
    </path>
    <path d="M0 250 Q 50 240 100 250 T 200 250 T 300 250 T 400 250 T 500 250 T 600 250 T 700 250 T 800 250">
      <animate attributeName="d" dur="7.5s" repeatCount="indefinite"
        values="M0 250 Q 50 260 100 250 T 200 250 T 300 250 T 400 250 T 500 250 T 600 250 T 700 250 T 800 250;
                M0 250 Q 50 240 100 250 T 200 250 T 300 250 T 400 250 T 500 250 T 600 250 T 700 250 T 800 250;
                M0 250 Q 50 260 100 250 T 200 250 T 300 250 T 400 250 T 500 250 T 600 250 T 700 250 T 800 250"/>
    </path>
  </g>

  <!-- reusable ship symbol -->
  <defs>
    <g id="ship">
      <path d="M-26 0 L26 0 L18 16 L-18 16 Z" fill="#e2e8f0"/>
      <rect x="-2" y="-40" width="3" height="40" fill="#cbd5e1"/>
      <path d="M1 -38 L22 -10 L1 -10 Z" fill="#f8fafc"/>
      <path d="M-2 -30 L-20 -8 L-2 -8 Z" fill="#bae6fd"/>
    </g>
  </defs>

  <!-- fleet: five vessels bobbing at different phases -->
  <g>
    <use href="#ship" x="0" y="0" transform="translate(120 205) scale(0.85)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0 0; 0 -6; 0 0" dur="3.2s" repeatCount="indefinite"/>
    </use>
    <text x="120" y="238" text-anchor="middle" font-family="monospace" font-size="12" fill="#7dd3fc">harbor-nano</text>
  </g>
  <g>
    <use href="#ship" transform="translate(275 200) scale(0.95)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0 0; 0 -7; 0 0" dur="3.9s" repeatCount="indefinite"/>
    </use>
    <text x="275" y="236" text-anchor="middle" font-family="monospace" font-size="12" fill="#7dd3fc">harbor-mini</text>
  </g>
  <g>
    <use href="#ship" transform="translate(430 196) scale(1.1)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0 0; 0 -8; 0 0" dur="4.5s" repeatCount="indefinite"/>
    </use>
    <text x="430" y="236" text-anchor="middle" font-family="monospace" font-size="12" fill="#fcd34d">clipper-pro</text>
  </g>
  <g>
    <use href="#ship" transform="translate(600 192) scale(1.25)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0 0; 0 -9; 0 0" dur="5.1s" repeatCount="indefinite"/>
    </use>
    <text x="600" y="236" text-anchor="middle" font-family="monospace" font-size="12" fill="#fca5a5">galleon-max</text>
  </g>
  <g>
    <use href="#ship" transform="translate(720 204) scale(0.9)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0 0; 0 -6; 0 0" dur="3.6s" repeatCount="indefinite"/>
    </use>
    <text x="720" y="238" text-anchor="middle" font-family="monospace" font-size="11" fill="#86efac">lighthouse</text>
  </g>

  <text x="400" y="30" text-anchor="middle" font-family="monospace" font-size="20" fill="#f8fafc" letter-spacing="3">M O D E L M A R I N E R</text>
  <text x="400" y="320" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">offline trace evaluation &amp; routing-policy compiler</text>
</svg>

// draft note 14
